name: Go Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ "1.24.x", "stable" ]
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -shuffle=on -coverprofile=cover.out ./...

    - name: Run every benchmark once
      run: go test -run='^$' -bench=. -benchtime=1x ./...

    - name: Send Coverage Report
      if: matrix.go == 'stable'
      uses: shogo82148/actions-goveralls@v1
      with:
        path-to-profile: cover.out

  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Fuzz against the reference implementation
      run: go test -run='^$' -fuzz=FuzzDifferential -fuzztime=60s

    - name: Fuzz case folding
      run: go test -run='^$' -fuzz=FuzzFold -fuzztime=20s

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest

  benchmark-suite:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: _benchmark/go.mod

    - name: Build the comparison benchmark
      working-directory: _benchmark
      run: go vet ./...
